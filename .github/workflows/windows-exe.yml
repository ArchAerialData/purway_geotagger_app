name: windows-exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHON_VERSION: "3.11"
      # Pin ExifTool so Windows builds are deterministic and don't depend on PATH.
      EXIFTOOL_VERSION: "13.50"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install deps (including tzdata for Windows ZoneInfo)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt tzdata

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Download + stage ExifTool (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/windows/stage_exiftool.ps1 -Version "${env:EXIFTOOL_VERSION}" -BuildDir "build" -StageDir "build/windows_exiftool"

      - name: Build Windows exe (shared local/CI script)
        shell: pwsh
        run: ./scripts/windows/build_exe.ps1 -PythonExe "python" -ExifToolVersion "${env:EXIFTOOL_VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurwayGeotagger-windows
          path: dist/windows/PurwayGeotagger/**
          if-no-files-found: error
