name: windows-installer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHON_VERSION: "3.11"
      # Pin ExifTool so Windows builds are deterministic and don't depend on PATH.
      EXIFTOOL_VERSION: "13.50"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Resolve app version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $txt = Get-Content -Raw "src/purway_geotagger/__init__.py"
          $ver = "0.0.0"
          if ($txt -match '__version__\s*=\s*"([^"]+)"') { $ver = $Matches[1] }
          Add-Content -Path $env:GITHUB_ENV -Value ("APP_VERSION=" + $ver)
          Write-Host ("APP_VERSION=" + $ver)

      - name: Install deps (including tzdata for Windows ZoneInfo)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt tzdata

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Download + stage ExifTool (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/windows/stage_exiftool.ps1 -Version "${env:EXIFTOOL_VERSION}" -BuildDir "build" -StageDir "build/windows_exiftool"

      - name: Build Windows exe (shared local/CI script)
        shell: pwsh
        run: ./scripts/windows/build_exe.ps1 -PythonExe "python" -ExifToolVersion "${env:EXIFTOOL_VERSION}"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at expected path: $iscc" }
          Write-Host "Found ISCC.exe at: $iscc"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at expected path: $iscc" }
          & $iscc "scripts/windows/PurwayGeotagger.iss"

          $outDir = "dist/windows-installer"
          if (-not (Test-Path $outDir)) { throw "Installer output folder missing: $outDir" }

          $expected = Join-Path $outDir ("PurwayGeotagger-Setup-" + "${env:APP_VERSION}" + ".exe")
          if (-not (Test-Path $expected)) {
            Write-Host "Expected installer not found at: $expected"
            Write-Host "Directory contents:"
            Get-ChildItem -Force $outDir | Format-Table -AutoSize
            throw "Installer build failed."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurwayGeotagger-windows-installer
          path: dist/windows-installer/*.exe
          if-no-files-found: error
